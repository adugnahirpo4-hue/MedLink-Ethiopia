<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedLink Ethiopia</title>
    <link rel="stylesheet" href="css/MedLink.css">
</head>
<body>
  
    <main class="hero">
        <h2>Login</h2>
        <p>Users must log in before receiving services from doctors or hospitals.</p>

        <section style="margin-top: 2rem; text-align: left; max-width: 450px; margin-left: auto; margin-right: auto;">
            <h3>Login Form</h3>
            <form>
                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email address" style="width: 100%; padding: 10px; margin-bottom: 10px;" />
                <input type="password" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 10px;" />
                <button type="button">Login</button>
            </form>
        </section>
    </main>
  
</body>
</html>
