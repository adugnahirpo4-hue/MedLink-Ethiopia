<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedLink Ethiopia</title>
    <link rel="stylesheet" href="css/MedLink.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <a href="MedLink.html" aria-label="MedLink Ethiopia main home">
                <img src="images/MedLink-Logo.jpg" alt="MedLink Ethiopia logo" class="logo-image">
            </a>
            <h1>MedLink Ethiopia</h1>
        </div>
        <nav aria-label="Main navigation">
            <ul class="nav-menu">
                <li><a href="MedLink.html">Home</a></li>
                <li><a href="home.html">About</a></li>
                <li><a href="hospitals.html">Hospitals</a></li>
                <li><a href="doctors.html">Doctors</a></li>
                <li><a href="appointment.html">Appointment</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <h2>Login</h2>
        <p>Users must log in before receiving services from doctors or hospitals.</p>

        <section class="page-card page-section" style="margin-top: 2rem; max-width: 450px;">
            <h3>Login Form</h3>
            <form class="login-form" id="loginForm">
                <input id="fullName" type="text" placeholder="Full Name">
                <input id="email" type="email" placeholder="Email address" />
                <input id="password" type="password" placeholder="Password" />
                <button type="button" id="loginBtn">Login</button>
                <p id="loginMessage" class="section-note"></p>
            </form>
        </section>
    </main>
    <script src="js/MedLink.js"></script>
</body>
</html>
